apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: academic-docs
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'academic-auth-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['auth-service:8001']

      - job_name: 'academic-file-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['file-service:8002']

      - job_name: 'academic-metadata-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['metadata-service:8003']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: academic-docs
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus/"
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: academic-docs
  labels:
    app: prometheus
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
      name: web
  selector:
    app: prometheus
