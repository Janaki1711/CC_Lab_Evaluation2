# ==============================================================================
# STRATEGY 1: Default Kubernetes Scheduling (Baseline)
# Demonstrates standard kube-scheduler heuristics without custom affinity rules
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: academic-docs
  labels:
    app: file-service
    strategy: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
        strategy: default
    spec:
      # NOTE: No affinity or anti-affinity configured.
      # Pods are scheduled purely according to NodeResourcesFit and default spread.
      containers:
        - name: file-service
          image: file-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: academic-docs
  labels:
    app: file-service
spec:
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: file-service
  type: ClusterIP
