# ==============================================================================
# CONFIGURATION C: Replica Spread & Autoscaling (Anti-Affinity + HPA, No Affinity)
# As specified in System Design Document (Section 14, Configuration C):
# • Investigates purely the fault tolerance and replica distribution across worker nodes.
# • HPA is ON (scales between 2 and 6 replicas at 60% CPU utilization).
# • Pod Affinity is NONE.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: academic-docs
  labels:
    app: file-service
    strategy: spread-scaling-only
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
        strategy: spread-scaling-only
    spec:
      affinity:
        # Pod Anti-Affinity: Spread file-service replicas across distinct worker nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - file-service
                topologyKey: "kubernetes.io/hostname"

      containers:
        - name: file-service
          image: file-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: academic-docs
  labels:
    app: file-service
spec:
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: file-service
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file-service-hpa
  namespace: academic-docs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
