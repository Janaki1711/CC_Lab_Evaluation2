# ==============================================================================
# CONFIGURATION B: Locality Study (Preferred Pod Affinity Only, No Anti-Affinity)
# As specified in System Design Document (Section 14, Configuration B):
# • Investigates purely the inter-service network latency reduction achieved by
#   co-locating File Service with Metadata Service on the same worker node.
# • HPA is OFF. Anti-Affinity is NONE.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: academic-docs
  labels:
    app: file-service
    strategy: locality-only
spec:
  replicas: 3
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
        strategy: locality-only
    spec:
      affinity:
        # Preferred Pod Affinity: Encourage co-location on the worker node running metadata-service
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - metadata-service
                topologyKey: "kubernetes.io/hostname"

      containers:
        - name: file-service
          image: file-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: academic-docs
  labels:
    app: file-service
spec:
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: file-service
  type: ClusterIP
