apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-store
  namespace: academic-docs
  labels:
    app: minio
    tier: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        tier: storage
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-03-30T09-41-56Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: minio-storage
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: academic-docs
  labels:
    app: minio
spec:
  ports:
    - port: 9000
      targetPort: 9000
      name: s3-api
    - port: 9001
      targetPort: 9001
      name: web-console
  selector:
    app: minio
  type: ClusterIP
---
# Job to auto-create bucket 'academic-documents'
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket-job
  namespace: academic-docs
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-mc
          image: minio/mc:RELEASE.2024-03-30T15-31-52Z
          command:
            - /bin/sh
            - -c
            - |
              sleep 5;
              /usr/bin/mc alias set myminio http://minio-service:9000 minio_admin academic_secure_password_2026;
              /usr/bin/mc mb myminio/academic-documents --ignore-existing;
              /usr/bin/mc anonymous set download myminio/academic-documents;
              echo "MinIO academic-documents bucket verified!";
