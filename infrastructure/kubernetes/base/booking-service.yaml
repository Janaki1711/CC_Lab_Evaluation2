apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: academic-docs
  labels:
    app: booking-service
    tier: ticket-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
        tier: ticket-engine
    spec:
      affinity:
        # 1. Pod Anti-Affinity: Spread replicas across worker nodes to handle 10,000 user surges
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - booking-service
                topologyKey: "kubernetes.io/hostname"

        # 2. Pod Affinity: Co-locate with Redis cache on worker node for sub-ms lock latency
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - bms-redis
                topologyKey: "kubernetes.io/hostname"

      containers:
        - name: booking-service
          image: booking-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "postgres_admin"
            - name: POSTGRES_PASSWORD
              value: "academic_secure_password_2026"
            - name: POSTGRES_DB
              value: "academic_docs_db"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: LOCK_TTL_SECONDS
              value: "60"
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: academic-docs
  labels:
    app: booking-service
spec:
  ports:
    - port: 8004
      targetPort: 8004
      name: http
  selector:
    app: booking-service
  type: ClusterIP
