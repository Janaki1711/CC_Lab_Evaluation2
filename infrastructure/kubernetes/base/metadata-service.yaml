apiVersion: v1
kind: ServiceAccount
metadata:
  name: metadata-service-sa
  namespace: academic-docs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metadata-cluster-viewer
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metadata-cluster-viewer-binding
subjects:
  - kind: ServiceAccount
    name: metadata-service-sa
    namespace: academic-docs
roleRef:
  kind: ClusterRole
  name: metadata-cluster-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-service
  namespace: academic-docs
  labels:
    app: metadata-service
    tier: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata-service
  template:
    metadata:
      labels:
        app: metadata-service
        tier: microservice
    spec:
      serviceAccountName: metadata-service-sa
      containers:
        - name: metadata-service
          image: metadata-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-service
  namespace: academic-docs
  labels:
    app: metadata-service
spec:
  ports:
    - port: 8003
      targetPort: 8003
      name: http
  selector:
    app: metadata-service
  type: ClusterIP
