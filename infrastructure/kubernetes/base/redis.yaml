apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-redis
  namespace: academic-docs
  labels:
    app: bms-redis
    role: distributed-lock-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bms-redis
  template:
    metadata:
      labels:
        app: bms-redis
        role: distributed-lock-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: academic-docs
  labels:
    app: bms-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: bms-redis
  type: ClusterIP
